[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/cli",
    "apps/mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ismethr/YanMo"
rust-version = "1.85"

[workspace.dependencies]
# 内部 crate
ym-model    = { path = "crates/ym-model" }
ym-latex    = { path = "crates/ym-latex" }
ym-commands = { path = "crates/ym-commands" }
ym-compile  = { path = "crates/ym-compile" }
ym-bib      = { path = "crates/ym-bib" }
ym-ai       = { path = "crates/ym-ai" }
ym-check    = { path = "crates/ym-check" }
ym-mcp      = { path = "apps/mcp" }

# 第三方
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
thiserror  = "1"
anyhow     = "1"
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
clap       = { version = "4", features = ["derive"] }
