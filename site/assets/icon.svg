<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- YanMo 应用图标：macOS 网格（1024 画布，824 主体，四周留 100 边距），浅底墨色。
       折面笔尖：左浅右深两面形成折叠感；笔尖落在第一行上——左半行已写成浓墨，右半行仍是淡墨。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececf0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4b4bc"/>
      <stop offset="1" stop-color="#83838d"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45454d"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c2c32"/>
      <stop offset="1" stop-color="#4a4a52"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.24"/>
    </filter>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>

  <!-- 主体 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.08"/>

  <!-- 文字行：第一行左半已写成 -->
  <rect x="268" y="778" width="488" height="28" rx="14" fill="#dcdce2"/>
  <rect x="268" y="778" width="250" height="28" rx="14" fill="url(#ink)"/>
  <rect x="268" y="836" width="360" height="28" rx="14" fill="#e3e3e8"/>

  <!-- 笔尖 -->
  <g filter="url(#soft)" transform="translate(0 22)">
    <path clip-path="url(#left)" fill="url(#light)" d="M512 770 C478 692 404 562 364 480 C346 442 350 406 370 376 L414 302 C426 282 446 270 470 270 H554 C578 270 598 282 610 302 L654 376 C674 406 678 442 660 480 C620 562 546 692 512 770 Z"/>
    <path clip-path="url(#right)" fill="url(#dark)" d="M512 770 C478 692 404 562 364 480 C346 442 350 406 370 376 L414 302 C426 282 446 270 470 270 H554 C578 270 598 282 610 302 L654 376 C674 406 678 442 660 480 C620 562 546 692 512 770 Z"/>
    <!-- 颈部分隔线 -->
    <path d="M396 340 H628" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
    <!-- 出墨缝与透气孔 -->
    <path d="M512 748 V492" stroke="#f6f6f8" stroke-width="16" stroke-linecap="round"/>
    <circle cx="512" cy="462" r="32" fill="#f6f6f8"/>
  </g>
</svg>
