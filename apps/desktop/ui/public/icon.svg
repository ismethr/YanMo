<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- YanMo 应用图标：macOS 网格（1024 画布，824 主体，四周留 100 边距），黑白。
       构图：论文从键盘中送出（打字机隐喻），钢笔斜落在纸面上。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="kb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#cfcfd1"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#161617"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- 主体 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>

  <g clip-path="url(#squircle)">
    <!-- 论文（在键盘之后，像从打字机中送出） -->
    <g filter="url(#soft)">
      <path d="M318 168 H640 L712 240 V640 H318 Z" fill="url(#paper)"/>
      <path d="M640 168 V222 a18 18 0 0 0 18 18 H712 Z" fill="#d6d6d8"/>
    </g>
    <!-- 标题与正文行 -->
    <rect x="364" y="236" width="196" height="22" rx="11" fill="#1c1c1e"/>
    <rect x="364" y="296" width="300" height="12" rx="6" fill="#b9b9bc"/>
    <rect x="364" y="330" width="300" height="12" rx="6" fill="#b9b9bc"/>
    <rect x="364" y="364" width="236" height="12" rx="6" fill="#b9b9bc"/>
    <rect x="364" y="414" width="300" height="12" rx="6" fill="#b9b9bc"/>
    <rect x="364" y="448" width="270" height="12" rx="6" fill="#b9b9bc"/>
    <rect x="364" y="482" width="160" height="12" rx="6" fill="#b9b9bc"/>

    <!-- 键盘 -->
    <g filter="url(#drop)">
      <rect x="168" y="588" width="688" height="300" rx="58" fill="url(#kb)"/>
    </g>
    <rect x="268" y="606" width="488" height="10" rx="5" fill="#9d9da1"/>
    <g fill="url(#key)">
      <rect x="214" y="644" width="64" height="54" rx="13"/>
      <rect x="290" y="644" width="64" height="54" rx="13"/>
      <rect x="366" y="644" width="64" height="54" rx="13"/>
      <rect x="442" y="644" width="64" height="54" rx="13"/>
      <rect x="518" y="644" width="64" height="54" rx="13"/>
      <rect x="594" y="644" width="64" height="54" rx="13"/>
      <rect x="670" y="644" width="64" height="54" rx="13"/>
      <rect x="746" y="644" width="64" height="54" rx="13"/>
      <rect x="248" y="712" width="64" height="54" rx="13"/>
      <rect x="324" y="712" width="64" height="54" rx="13"/>
      <rect x="400" y="712" width="64" height="54" rx="13"/>
      <rect x="476" y="712" width="64" height="54" rx="13"/>
      <rect x="552" y="712" width="64" height="54" rx="13"/>
      <rect x="628" y="712" width="64" height="54" rx="13"/>
      <rect x="704" y="712" width="72" height="54" rx="13"/>
      <rect x="214" y="780" width="98" height="54" rx="13"/>
      <rect x="324" y="780" width="376" height="54" rx="13"/>
      <rect x="712" y="780" width="98" height="54" rx="13"/>
    </g>

    <!-- 钢笔：笔尖落在正文行上 -->
    <g transform="translate(600 452) rotate(38)" filter="url(#soft)">
      <rect x="-37" y="-400" width="74" height="232" rx="34" fill="#111112" stroke="#f2f2f2" stroke-width="7"/>
      <rect x="-39" y="-262" width="78" height="16" rx="4" fill="#f2f2f2"/>
      <rect x="-31" y="-176" width="62" height="50" rx="9" fill="#2c2c2e" stroke="#f2f2f2" stroke-width="7"/>
      <path d="M0 0 L-29 -92 Q-32 -118 -27 -128 H27 Q32 -118 29 -92 Z" fill="#111112" stroke="#f2f2f2" stroke-width="6" stroke-linejoin="round"/>
      <path d="M0 -8 V-74" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="8" fill="#f2f2f2"/>
    </g>
  </g>

  <!-- 细高光边 -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
